<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>KVI School Intelligence | Kashyap Vidyapeeth Inaruwa</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
<div id="login-view" class="login-wrap" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand-mark">KV</div>
    <h1>Kashyap Vidyapeeth Inaruwa</h1>
    <p class="muted">School Intelligence &amp; Daily Reporting — authorized users only</p>
    <label>Username <input name="username" required autocomplete="username" maxlength="80"></label>
    <label>Password <input name="password" type="password" required autocomplete="current-password" maxlength="256"></label>
    <button type="submit" class="btn primary block">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
    <p class="fine">Access is logged. Unauthorized use is prohibited.</p>
  </form>
</div>

<div id="app-view" class="app" hidden>
  <header class="topbar">
    <button id="nav-toggle" class="btn ghost nav-toggle" aria-expanded="false" aria-controls="sidebar">☰ Menu</button>
    <div class="brand">
      <span class="brand-mark sm">KV</span>
      <div><div class="brand-title">Kashyap Vidyapeeth Inaruwa</div>
      <div class="brand-sub">School Intelligence &amp; Daily Reporting · Asia/Kathmandu</div></div>
    </div>
    <div class="top-actions">
      <span id="user-badge" class="badge"></span>
      <button id="logout-btn" class="btn ghost">Sign out</button>
    </div>
  </header>
  <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
  <main id="content" class="content" tabindex="-1" aria-live="polite"></main>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
  <div class="modal-card">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn ghost">Cancel</button>
      <button id="modal-ok" class="btn primary">Confirm</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
