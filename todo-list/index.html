<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App | Manage Your Tasks</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">✓ My To-Do List</h1>
                <p class="app-subtitle">Stay organized and boost your productivity</p>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="taskInput"
                        class="task-input"
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                    <button id="addBtn" class="add-btn" title="Add task">+ Add Task</button>
                </div>
                <div class="input-help">Press Enter or click Add Task to create a new item</div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                    <button class="filter-btn" data-filter="high">High Priority</button>
                </div>
                <div class="stats">
                    <span id="taskCount" class="stat">0 tasks</span>
                    <span id="completedCount" class="stat">0 completed</span>
                </div>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <ul id="tasksList" class="tasks-list">
                    <!-- Tasks will be added here -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📝</div>
                    <p>No tasks yet! Create one to get started.</p>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions-section">
                <button id="clearCompletedBtn" class="action-btn secondary-btn" title="Clear all completed tasks">
                    🗑️ Clear Completed
                </button>
                <button id="clearAllBtn" class="action-btn danger-btn" title="Delete all tasks">
                    ⚠️ Clear All
                </button>
                <button id="exportBtn" class="action-btn primary-btn" title="Export tasks as JSON">
                    📥 Export
                </button>
                <button id="importBtn" class="action-btn primary-btn" title="Import tasks from JSON">
                    📤 Import
                </button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 To-Do List App | Built with ❤️</p>
            <p class="footer-hint">Your tasks are saved automatically in your browser</p>
        </footer>
    </div>

    <!-- Hidden File Input for Import -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2 id="confirmTitle">Confirm Action</h2>
            <p id="confirmMessage">Are you sure?</p>
            <div class="modal-buttons">
                <button id="confirmYes" class="btn-primary">Yes</button>
                <button id="confirmNo" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
